services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: patch
      POSTGRES_PASSWORD: patch
      POSTGRES_DB: patch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patch"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # UI web

volumes:
  pgdata:
